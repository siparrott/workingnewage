# Build the TogNinja container image and push it to GHCR (private).
# Intended for the PRIVATE TEMPLATE REPO. Runs only on version tags or manual dispatch,
# so normal commits never trigger a build. The image is what customers' Render services pull.
#
# No extra secrets needed: GHCR auth uses the built-in GITHUB_TOKEN.
# Image name: ghcr.io/<owner>/<repo>:<tag>  (private if the repo is private).
name: Build & push image

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
